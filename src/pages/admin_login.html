<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BOB币 - 管理端登录</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/assets/admin_login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-board" aria-label="BOB币管理端登录">
        <aside class="login-visual" aria-hidden="true">
          <div class="visual-topline">
            <div class="brand-badge">BOB</div>
            <span>Baymax Group</span>
          </div>
          <div class="visual-title">
            <h1>BOB币管理端</h1>
            <p>用户、商城、核销与活动管理</p>
          </div>
          <div class="visual-card visual-card-main">
            <span>核心模块</span>
            <strong>Admin Console</strong>
          </div>
          <div class="visual-card visual-card-sub">
            <span>当前域名</span>
            <strong id="currentHost"></strong>
          </div>
        </aside>

        <section class="login-panel">
          <div class="login-head">
            <div class="mobile-brand">
              <div class="brand-badge">BOB</div>
              <span>BOB币管理端</span>
            </div>
            <h2>登录</h2>
            <p id="hint">正在检查登录状态</p>
          </div>

          <section class="login-card login-card-primary" id="cardDingtalk">
            <div class="card-title">钉钉授权登录</div>
            <div class="ding-actions">
              <button id="btnDingLogin" disabled>正在检查…</button>
            </div>
            <div class="error" id="dingErr"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="https://g.alicdn.com/dingding/dingtalk-jsapi/2.15.4/dingtalk.open.js"></script>
    <script src="/assets/base.js"></script>
    <script src="/assets/admin_login.js"></script>
  </body>
</html>
